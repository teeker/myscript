<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家族樂捐系統</title>
  <!-- QR Code 產生庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
    }

    .header {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      padding: 16px 20px;
      text-align: center;
    }
    .header h1 { font-size: 22px; font-weight: 600; color: #1d1d1f; }
    .header p  { font-size: 14px; color: #6e6e73; margin-top: 4px; }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      margin: 20px auto;
      max-width: 480px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .card h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #1d1d1f;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #3a3a3c;
      margin-bottom: 6px;
      margin-top: 16px;
    }
    label:first-of-type { margin-top: 0; }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #d1d1d6;
      border-radius: 10px;
      font-size: 16px;
      color: #1d1d1f;
      background: #fafafa;
      transition: border-color 0.2s;
      outline: none;
    }
    input:focus { border-color: #0071e3; background: #fff; }

    .required-mark { color: #e53935; margin-left: 3px; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 24px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary   { background: #0071e3; color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-confirm   { background: #34c759; color: #fff; }
    .btn-back      { background: #f2f2f7; color: #3a3a3c; margin-top: 12px; }

    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    #qrcode canvas, #qrcode img {
      border-radius: 12px;
      border: 6px solid #fff;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }

    .info-box {
      background: #f2f2f7;
      border-radius: 12px;
      padding: 16px 18px;
      width: 100%;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #e5e5ea;
      font-size: 15px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #6e6e73; font-weight: 500; }
    .info-value { color: #1d1d1f; font-weight: 600; }
    .info-value.amount { color: #e53935; font-size: 18px; }

    .hint {
      font-size: 13px;
      color: #6e6e73;
      text-align: center;
      line-height: 1.6;
    }

    .success-icon {
      font-size: 56px;
      text-align: center;
    }
    .success-title {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      color: #1d1d1f;
      margin: 8px 0 6px;
    }
    .success-sub {
      font-size: 15px;
      color: #6e6e73;
      text-align: center;
    }

    .sheet-link-btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: #f2f2f7;
      color: #0071e3;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      margin-top: 16px;
    }

    .page { display: none; }
    .page.active { display: block; }

    .error-msg {
      color: #e53935;
      font-size: 13px;
      margin-top: 6px;
      display: none;
    }

    .spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 2.5px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="header">
  <h1>🎉 家族樂捐</h1>
  <p>愛心傳遞，共享歡樂</p>
</div>

<!-- ======== 頁面 1：填寫表單 ======== -->
<div id="page-form" class="page active">
  <div class="card">
    <h2>填寫捐款資料</h2>

    <label>姓名 <span class="required-mark">*</span></label>
    <input type="text" id="inp-name" placeholder="請輸入您的姓名">
    <div class="error-msg" id="err-name">請填寫姓名</div>

    <label>手機號碼</label>
    <input type="tel" id="inp-phone" placeholder="09xx-xxx-xxx（選填）">

    <label>Line ID</label>
    <input type="text" id="inp-line" placeholder="@your_line_id（選填）">

    <label>捐款金額（元）<span class="required-mark">*</span></label>
    <input type="number" id="inp-amount" placeholder="請輸入金額" min="1">
    <div class="error-msg" id="err-amount">請填寫捐款金額</div>

    <button class="btn btn-primary" onclick="submitForm()">產生確認 QR Code</button>
  </div>
</div>

<!-- ======== 頁面 2：顯示 QR code 給收款人掃 ======== -->
<div id="page-qr" class="page">
  <div class="card">
    <h2>請收款人掃描 QR Code</h2>
    <div class="qr-container">
      <div id="qrcode"></div>
      <p class="hint">收款人用手機掃描此 QR Code<br>確認資料後按「確認收款」完成登錄</p>
    </div>
    <button class="btn btn-back" onclick="goBack()">← 重新填寫</button>
  </div>
</div>

<!-- ======== 頁面 3：收款人確認頁（由 QR code 掃碼進入） ======== -->
<div id="page-confirm" class="page">
  <div class="card">
    <h2>確認捐款資料</h2>
    <div class="info-box">
      <div class="info-row">
        <span class="info-label">姓名</span>
        <span class="info-value" id="conf-name">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">手機號碼</span>
        <span class="info-value" id="conf-phone">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">Line ID</span>
        <span class="info-value" id="conf-line">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">捐款金額</span>
        <span class="info-value amount" id="conf-amount">—</span>
      </div>
    </div>
    <button class="btn btn-confirm" id="confirm-btn" onclick="confirmDonation()">✓ 確認收款</button>
    <p class="hint" style="margin-top: 12px;">按下確認後資料將自動寫入紀錄表</p>
  </div>
</div>

<!-- ======== 頁面 4：完成頁 ======== -->
<div id="page-done" class="page">
  <div class="card">
    <div class="success-icon">✅</div>
    <p class="success-title">收款確認完成！</p>
    <p class="success-sub">感謝您的愛心捐款</p>

    <div class="info-box" style="margin-top: 20px;">
      <div class="info-row">
        <span class="info-label">姓名</span>
        <span class="info-value" id="done-name">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">捐款金額</span>
        <span class="info-value amount" id="done-amount">—</span>
      </div>
    </div>

    <a id="sheet-link" class="sheet-link-btn" href="#" target="_blank">📊 查看所有捐款紀錄</a>
    <button class="btn btn-back" style="margin-top: 10px" onclick="resetAll()">返回首頁</button>
  </div>
</div>

<script>
  // ================================================================
  // ⚠️ 請修改以下兩個設定值
  // ================================================================

  // 1. 把你的 Apps Script 部署網址貼在這裡
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwrpXjOLyhoEMy2F23DAkGuKZeSMYgVgLwyN4GPf24U4GPRl6QE7WrnY4OFK_f4aBv3/exec";

  // 2. 把你的 Google Sheets 公開連結貼在這裡
  const SHEET_VIEW_URL = "https://docs.google.com/spreadsheets/d/1gzJ9GmofOYrO6EvDvpEDPDD2V9XB9w6CfkTomXpjoVA//edit?usp=sharing";

  // ================================================================

  // 判斷是否為收款人掃碼進入
  window.onload = function () {
    const params = new URLSearchParams(window.location.search);
    if (params.get("confirm") === "1") {
      showConfirmPage(params);
    }
  };

  // 表單送出
  function submitForm() {
    const name   = document.getElementById("inp-name").value.trim();
    const phone  = document.getElementById("inp-phone").value.trim();
    const lineId = document.getElementById("inp-line").value.trim();
    const amount = document.getElementById("inp-amount").value.trim();

    let valid = true;
    document.getElementById("err-name").style.display   = "none";
    document.getElementById("err-amount").style.display = "none";

    if (!name) {
      document.getElementById("err-name").style.display = "block";
      valid = false;
    }
    if (!amount || Number(amount) <= 0) {
      document.getElementById("err-amount").style.display = "block";
      valid = false;
    }
    if (!valid) return;

    // 建立確認頁的網址（含所有資料作為參數）
    const base    = window.location.origin + window.location.pathname;
    const confirm = `${base}?confirm=1&name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&line=${encodeURIComponent(lineId)}&amount=${encodeURIComponent(amount)}`;

    // 產生 QR Code
    document.getElementById("qrcode").innerHTML = "";
    new QRCode(document.getElementById("qrcode"), {
      text: confirm,
      width: 240,
      height: 240,
      colorDark: "#1d1d1f",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });

    showPage("page-qr");
  }

  // 收款人掃碼後，顯示確認頁
  function showConfirmPage(params) {
    document.getElementById("conf-name").textContent   = params.get("name")   || "—";
    document.getElementById("conf-phone").textContent  = params.get("phone")  || "（未填寫）";
    document.getElementById("conf-line").textContent   = params.get("line")   || "（未填寫）";
    document.getElementById("conf-amount").textContent = "NT$ " + (params.get("amount") || "—");
    showPage("page-confirm");
  }

  // 確認收款，寫入試算表
  function confirmDonation() {
    const params = new URLSearchParams(window.location.search);
    const btn    = document.getElementById("confirm-btn");

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>寫入紀錄中…';

    const payload = {
      name:   params.get("name"),
      phone:  params.get("phone"),
      lineId: params.get("line"),
      amount: params.get("amount")
    };

    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        document.getElementById("done-name").textContent   = payload.name;
        document.getElementById("done-amount").textContent = "NT$ " + payload.amount;
        document.getElementById("sheet-link").href         = SHEET_VIEW_URL;
        showPage("page-done");
      } else {
        alert("寫入失敗，請重試");
        btn.disabled = false;
        btn.innerHTML = "✓ 確認收款";
      }
    })
    .catch(() => {
      alert("網路錯誤，請確認連線後重試");
      btn.disabled = false;
      btn.innerHTML = "✓ 確認收款";
    });
  }

  function showPage(id) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    window.scrollTo(0, 0);
  }

  function goBack()  { showPage("page-form"); }
  function resetAll() {
    // 清空表單
    ["inp-name","inp-phone","inp-line","inp-amount"].forEach(id => {
      document.getElementById(id).value = "";
    });
    // 移除網址參數
    history.replaceState({}, "", window.location.pathname);
    showPage("page-form");
  }
</script>
</body>
</html>
