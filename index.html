<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家族樂捐系統</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
    }

    .header {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      padding: 16px 20px;
      text-align: center;
    }
    .header h1 { font-size: 22px; font-weight: 600; }
    .header p  { font-size: 14px; color: #6e6e73; margin-top: 4px; }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      margin: 20px auto;
      max-width: 480px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .card h2 { font-size: 18px; font-weight: 600; margin-bottom: 20px; }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #3a3a3c;
      margin-bottom: 6px;
      margin-top: 16px;
    }
    label:first-of-type { margin-top: 0; }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #d1d1d6;
      border-radius: 10px;
      font-size: 16px;
      background: #fafafa;
      transition: border-color 0.2s;
      outline: none;
    }
    input:focus { border-color: #0071e3; background: #fff; }

    .required-mark { color: #e53935; margin-left: 3px; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 24px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: #0071e3; color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-confirm { background: #34c759; color: #fff; }
    .btn-back    { background: #f2f2f7; color: #3a3a3c; margin-top: 12px; }

    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    #qrcode canvas, #qrcode img {
      border-radius: 12px;
      border: 6px solid #fff;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }

    .info-box {
      background: #f2f2f7;
      border-radius: 12px;
      padding: 16px 18px;
      width: 100%;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #e5e5ea;
      font-size: 15px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #6e6e73; font-weight: 500; }
    .info-value { color: #1d1d1f; font-weight: 600; }
    .info-value.amount { color: #e53935; font-size: 18px; }

    .hint {
      font-size: 13px;
      color: #6e6e73;
      text-align: center;
      line-height: 1.6;
    }

    .success-icon  { font-size: 56px; text-align: center; }
    .success-title { font-size: 22px; font-weight: 700; text-align: center; margin: 8px 0 6px; }
    .success-sub   { font-size: 15px; color: #6e6e73; text-align: center; }

    .sheet-link-btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: #f2f2f7;
      color: #0071e3;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      margin-top: 16px;
    }

    .page { display: none; }
    .page.active { display: block; }

    .error-msg {
      color: #e53935;
      font-size: 13px;
      margin-top: 6px;
      display: none;
    }

    .alert-box {
      background: #fff2f2;
      border: 1px solid #ffcdd2;
      border-radius: 10px;
      padding: 14px 16px;
      margin-top: 16px;
      font-size: 14px;
      color: #c62828;
      display: none;
      line-height: 1.6;
    }

    .spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 2.5px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="header">
  <h1>🎉 家族樂捐</h1>
  <p>愛心傳遞，共享歡樂</p>
</div>

<!-- 頁面 1：填寫表單 -->
<div id="page-form" class="page active">
  <div class="card">
    <h2>填寫捐款資料</h2>

    <label>姓名 <span class="required-mark">*</span></label>
    <input type="text" id="inp-name" placeholder="請輸入您的姓名">
    <div class="error-msg" id="err-name">請填寫姓名</div>

    <label>手機號碼</label>
    <input type="tel" id="inp-phone" placeholder="09xx-xxx-xxx（選填）">

    <label>Line ID</label>
    <input type="text" id="inp-line" placeholder="@your_line_id（選填）">

    <label>捐款金額（元）<span class="required-mark">*</span></label>
    <input type="number" id="inp-amount" placeholder="請輸入金額" min="1">
    <div class="error-msg" id="err-amount">請填寫捐款金額</div>

    <button class="btn btn-primary" onclick="submitForm()">產生確認 QR Code</button>
  </div>
</div>

<!-- 頁面 2：QR code 給收款人掃 -->
<div id="page-qr" class="page">
  <div class="card">
    <h2>請收款人掃描 QR Code</h2>
    <div class="qr-container">
      <div id="qrcode"></div>
      <p class="hint">收款人用手機掃描此 QR Code<br>確認資料後按「確認收款」完成登錄</p>
    </div>
    <button class="btn btn-back" onclick="goBack()">← 重新填寫</button>
  </div>
</div>

<!-- 頁面 3：收款人確認頁（掃碼進入） -->
<div id="page-confirm" class="page">
  <div class="card">
    <h2>確認捐款資料</h2>
    <div class="info-box">
      <div class="info-row">
        <span class="info-label">姓名</span>
        <span class="info-value" id="conf-name">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">手機號碼</span>
        <span class="info-value" id="conf-phone">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">Line ID</span>
        <span class="info-value" id="conf-line">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">捐款金額</span>
        <span class="info-value amount" id="conf-amount">—</span>
      </div>
    </div>

    <button class="btn btn-confirm" id="confirm-btn" onclick="confirmDonation()">✓ 確認收款</button>

    <!-- 錯誤訊息區塊（注意：id="error-alert"，JS 裡用 errorAlert 變數，避開 window.alert 保留字） -->
    <div class="alert-box" id="error-alert"></div>

    <p class="hint" style="margin-top: 12px;">按下確認後資料將自動寫入紀錄表</p>
  </div>
</div>

<!-- 頁面 4：完成 -->
<div id="page-done" class="page">
  <div class="card">
    <div class="success-icon">✅</div>
    <p class="success-title">收款確認完成！</p>
    <p class="success-sub">感謝您的愛心捐款</p>

    <div class="info-box" style="margin-top: 20px;">
      <div class="info-row">
        <span class="info-label">姓名</span>
        <span class="info-value" id="done-name">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">捐款金額</span>
        <span class="info-value amount" id="done-amount">—</span>
      </div>
    </div>

    <a id="sheet-link" class="sheet-link-btn" href="#" target="_blank">📊 查看所有捐款紀錄</a>
    <button class="btn btn-back" style="margin-top: 10px" onclick="resetAll()">返回首頁</button>
  </div>
</div>

<script>
  // ================================================================
  // ⚠️ 請修改以下兩個設定值
  // ================================================================
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHfpjeoHqGzuIzDRcJ7dGWymWIzIhlDBioKq6AJI28iQyDqsI3Y0OS7F9YXSvUzPP1mg/exec";
  const SHEET_VIEW_URL  = "https://docs.google.com/spreadsheets/d/1gzJ9GmofOYrO6EvDvpEDPDD2V9XB9w6CfkTomXpjoVA/edit?usp=sharing";
  // ================================================================

  window.onload = function () {
    const params = new URLSearchParams(window.location.search);
    if (params.get("confirm") === "1") {
      showConfirmPage(params);
    }
  };

  function submitForm() {
    const name   = document.getElementById("inp-name").value.trim();
    const phone  = document.getElementById("inp-phone").value.trim();
    const lineId = document.getElementById("inp-line").value.trim();
    const amount = document.getElementById("inp-amount").value.trim();

    let valid = true;
    document.getElementById("err-name").style.display   = "none";
    document.getElementById("err-amount").style.display = "none";

    if (!name) {
      document.getElementById("err-name").style.display = "block";
      valid = false;
    }
    if (!amount || Number(amount) <= 0) {
      document.getElementById("err-amount").style.display = "block";
      valid = false;
    }
    if (!valid) return;

    const base    = window.location.origin + window.location.pathname;
    const confirm = `${base}?confirm=1`
      + `&name=${encodeURIComponent(name)}`
      + `&phone=${encodeURIComponent(phone)}`
      + `&line=${encodeURIComponent(lineId)}`
      + `&amount=${encodeURIComponent(amount)}`;

    document.getElementById("qrcode").innerHTML = "";
    new QRCode(document.getElementById("qrcode"), {
      text: confirm,
      width: 240,
      height: 240,
      colorDark: "#1d1d1f",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });

    showPage("page-qr");
  }

  function showConfirmPage(params) {
    document.getElementById("conf-name").textContent   = params.get("name")   || "—";
    document.getElementById("conf-phone").textContent  = params.get("phone")  || "（未填寫）";
    document.getElementById("conf-line").textContent   = params.get("line")   || "（未填寫）";
    document.getElementById("conf-amount").textContent = "NT$ " + (params.get("amount") || "—");
    showPage("page-confirm");
  }

  // ================================================================
  // 核心修正：
  //   1. 用 no-cors + GET 送出，Apps Script 端用 doGet 接收
  //   2. no-cors 模式下 fetch() 永遠回傳 opaque response，
  //      .catch() 只有「完全無法連線」才會觸發（例如沒有網路）。
  //      正常情況下（包含 Apps Script 執行失敗）都會走 .then()。
  //   3. 修正變數名稱：改用 errorAlert，避開 window.alert 保留字衝突。
  //   4. 加上 10 秒 timeout 保護，避免 fetch 永遠 pending。
  // ================================================================
  function confirmDonation() {
    const params     = new URLSearchParams(window.location.search);
    const btn        = document.getElementById("confirm-btn");
    const errorAlert = document.getElementById("error-alert"); // ← 不用 alert 當變數名

    btn.disabled    = true;
    btn.innerHTML   = '<span class="spinner"></span>寫入紀錄中…';
    errorAlert.style.display = "none";

    const url = APPS_SCRIPT_URL
      + "?action=submit"
      + "&name="   + encodeURIComponent(params.get("name")   || "")
      + "&phone="  + encodeURIComponent(params.get("phone")  || "")
      + "&lineId=" + encodeURIComponent(params.get("line")   || "")
      + "&amount=" + encodeURIComponent(params.get("amount") || "");

    // ── Timeout 保護：超過 10 秒視為失敗 ──
    const timeoutId = setTimeout(() => {
      showError(errorAlert, btn, "⏱ 請求逾時，請確認網路連線後再試一次。");
    }, 10000);

    // ── no-cors + GET：唯一能繞過 Apps Script CORS 限制的方式 ──
    // .then() 在 no-cors 下代表「請求已送達」（opaque response），不代表寫入成功。
    // 若需確認寫入結果，請改用 Google Apps Script + JSONP 方案，或在後端加 CORS header。
    fetch(url, { method: "GET", mode: "no-cors" })
      .then(() => {
        clearTimeout(timeoutId);
        // 等 1.5 秒讓 Apps Script 完成寫入（no-cors 無法讀取回應，只能等待）
        setTimeout(() => {
          document.getElementById("done-name").textContent   = params.get("name");
          document.getElementById("done-amount").textContent = "NT$ " + params.get("amount");
          document.getElementById("sheet-link").href         = SHEET_VIEW_URL;
          showPage("page-done");
        }, 1500);
      })
      .catch((err) => {
        // 只有真正無法連線（手機沒網路、URL 完全無效）才會到這裡
        clearTimeout(timeoutId);
        showError(errorAlert, btn,
          "❌ 無法連線，請確認：<br>"
          + "1. 手機有連上網路<br>"
          + "2. Apps Script 網址設定正確<br>"
          + "3. 部署時存取權選「所有人」<br><br>"
          + "<small>錯誤訊息：" + err.message + "</small>"
        );
      });
  }

  function showError(errorAlert, btn, msg) {
    errorAlert.innerHTML     = msg;
    errorAlert.style.display = "block";
    btn.disabled             = false;
    btn.innerHTML            = "✓ 確認收款";
  }

  function showPage(id) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    window.scrollTo(0, 0);
  }

  function goBack()  { showPage("page-form"); }

  function resetAll() {
    ["inp-name","inp-phone","inp-line","inp-amount"].forEach(id => {
      document.getElementById(id).value = "";
    });
    history.replaceState({}, "", window.location.pathname);
    showPage("page-form");
  }
</script>
</body>
</html>
